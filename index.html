<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17130f">
  <meta name="description" content="Lelele Sudoku - a calm, modern puzzle game with classic, mini, mega and variant sudoku.">
  <title>Sudoku — Lelele Games</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/board.css">
  <link rel="stylesheet" href="./styles/variants.css">
  <link rel="stylesheet" href="./styles/animations.css">
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <a class="brand" href="./" aria-label="Sudoku home"><span class="brand-mark">9</span> SUDOKU</a>
      <div class="header-actions">
        <button id="language-toggle" class="icon-button" type="button" aria-label="Switch language">中文</button>
        <button id="settings-button" class="icon-button" type="button" data-i18n="settings">Settings</button>
      </div>
    </header>

    <main id="main-content" class="main-content">
      <section id="home-panel" class="welcome-panel">
        <p class="eyebrow">LELELE GAMES</p>
        <h1 id="game-title" data-i18n="gameTitle">Sudoku</h1>
        <p class="welcome-copy" data-i18n="tagline">A quiet place to think, one cell at a time.</p>
        <div class="home-grid">
          <button id="continue-button" class="mode-button" type="button">
            <span class="mode-title" data-i18n="continueGame">Continue Game</span>
          </button>
          <button id="new-game-button" class="mode-button mode-button-primary" type="button">
            <span class="mode-title" data-i18n="newGame">New Game</span>
          </button>
          <button id="daily-button" class="mode-button" type="button">
            <span class="mode-title" data-i18n="dailyChallenge">Daily Challenge</span>
          </button>
          <button id="mode-time-attack" class="mode-button" type="button">
            <span class="mode-title" data-i18n="timeAttackMode">Time Attack</span>
          </button>
          <button id="variants-button" class="mode-button" type="button">
            <span class="mode-title" data-i18n="variants">Variants</span>
          </button>
          <button id="stats-button" class="mode-button" type="button">
            <span class="mode-title" data-i18n="statistics">Statistics</span>
          </button>
        </div>
        <button id="how-to-button" class="text-link" type="button" data-i18n="howToPlay">How to Play</button>
      </section>

      <section id="setup-panel" class="setup-panel" hidden>
        <h2 class="section-title" data-i18n="setupTitle">New Game</h2>
        <div class="setup-field">
          <label class="field-label" for="setup-size" data-i18n="boardSize">Board Size</label>
          <select id="setup-size" class="form-select">
            <option value="4" data-i18n="board4">4 × 4 Mini</option>
            <option value="6" data-i18n="board6">6 × 6 Mini</option>
            <option value="9" selected data-i18n="board9">9 × 9 Classic</option>
            <option value="16" data-i18n="board16">16 × 16 Mega</option>
          </select>
        </div>
        <div class="setup-field">
          <label class="field-label" for="setup-variant" data-i18n="variant">Puzzle Type</label>
          <select id="setup-variant" class="form-select"></select>
        </div>
        <div class="setup-field">
          <label class="field-label" for="setup-difficulty" data-i18n="difficulty">Difficulty</label>
          <select id="setup-difficulty" class="form-select">
            <option value="easy" data-i18n="easy">Easy</option>
            <option value="medium" selected data-i18n="medium">Medium</option>
            <option value="hard" data-i18n="hard">Hard</option>
            <option value="expert" data-i18n="expert">Expert</option>
            <option value="master" data-i18n="master">Master</option>
          </select>
        </div>
        <div class="setup-toggles">
          <label class="toggle-row"><input id="setup-error-check" type="checkbox" checked><span data-i18n="errorCheck">Instant Error Check</span></label>
          <label class="toggle-row"><input id="setup-hints" type="checkbox" checked><span data-i18n="hintsAllowed">Allow Hints</span></label>
          <label class="toggle-row"><input id="setup-timer" type="checkbox" checked><span data-i18n="timer">Show Timer</span></label>
          <label class="toggle-row"><input id="setup-auto-notes" type="checkbox"><span data-i18n="autoNotes">Auto Candidates</span></label>
        </div>
        <div class="dialog-actions">
          <button id="setup-back" class="button-secondary" type="button" data-i18n="back">Back</button>
          <button id="setup-start" class="button-primary" type="button" data-i18n="startGame">Start Game</button>
        </div>
      </section>

      <section id="variants-panel" class="list-panel" hidden>
        <h2 class="section-title" data-i18n="variants">Variants</h2>
        <div id="variant-list" class="variant-list"></div>
        <button id="variants-back" class="button-secondary" type="button" data-i18n="back">Back</button>
      </section>

      <section id="stats-panel" class="list-panel" hidden>
        <h2 class="section-title" data-i18n="statistics">Statistics</h2>
        <div id="stats-content" class="stats-content"></div>
        <div class="dialog-actions">
          <button id="leaderboard-button" class="button-secondary" type="button" data-i18n="leaderboard">Leaderboard</button>
          <button id="stats-back" class="button-primary" type="button" data-i18n="back">Back</button>
        </div>
      </section>

      <section id="game-panel" class="game-panel" hidden>
        <div class="game-topbar">
          <div class="game-meta">
            <span id="game-mode-label" class="status-pill">Classic</span>
            <span id="game-difficulty-label" class="status-pill">Medium</span>
          </div>
          <div class="game-metrics">
            <span class="metric"><span class="metric-label" data-i18n="time">Time</span> <strong id="timer-display">00:00</strong></span>
            <span class="metric"><span class="metric-label" data-i18n="mistakes">Mistakes</span> <strong id="mistake-count">0</strong></span>
            <span class="metric"><span class="metric-label" data-i18n="hints">Hints</span> <strong id="hint-count">0</strong></span>
          </div>
          <div class="game-top-actions">
            <button id="pause-button" class="icon-button" type="button" data-i18n="pause">Pause</button>
            <button id="game-settings-button" class="icon-button" type="button" data-i18n="rules">Rules</button>
          </div>
        </div>

        <div id="board-wrap" class="board-wrap">
          <div id="sudoku-board"></div>
        </div>

        <div id="numpad" class="numpad" aria-label="Number pad"></div>

        <div class="game-controls">
          <button id="notes-button" type="button" data-i18n="notesMode">Notes</button>
          <button id="undo-button" type="button" data-i18n="undo">Undo</button>
          <button id="redo-button" type="button" data-i18n="redo">Redo</button>
          <button id="hint-button" type="button" data-i18n="hint">Hint</button>
          <button id="erase-button" type="button" data-i18n="erase">Erase</button>
          <button id="restart-button" type="button" data-i18n="restart">Restart</button>
          <button id="back-button" type="button" data-i18n="back">Back</button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span data-i18n="madeBy">Made by Lelele Games</span>
    </footer>
  </div>

  <div id="dialog-backdrop" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title" class="dialog-title"></h2>
      <p id="dialog-copy" class="dialog-copy"></p>
      <div id="dialog-extra"></div>
      <div id="dialog-actions" class="dialog-actions"></div>
    </div>
  </div>

  <div id="toast" class="notification" role="status" aria-live="polite" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
